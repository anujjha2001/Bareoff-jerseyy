<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KickOff Jerseys - Premium Football Jerseys</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .logo span {
            color: #10b981;
        }

        .search-box input {
            padding: 0.5rem 1rem;
            width: 250px;
            border: none;
            border-radius: 25px;
            font-size: 0.9rem;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background: #10b981;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.7rem;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: white;
            text-align: center;
            padding: 4rem 2rem;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .shop-btn {
            background: #10b981;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .shop-btn:hover {
            transform: scale(1.05);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1.5rem;
            background: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #10b981;
            color: white;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* Product Card */
        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .product-club {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.3rem;
            color: #10b981;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .original-price {
            text-decoration: line-through;
            color: #999;
            font-size: 0.9rem;
            margin-left: 0.5rem;
        }

        .product-rating {
            color: #fbbf24;
            margin-bottom: 1rem;
        }

        .add-to-cart {
            width: 100%;
            padding: 0.75rem;
            background: #1f2937;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .add-to-cart:hover {
            background: #10b981;
        }

        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100%;
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            transition: right 0.3s;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            padding: 1.5rem;
            background: #1f2937;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-cart {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-weight: bold;
        }

        .cart-item-price {
            color: #10b981;
        }

        .cart-item-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-top: 0.5rem;
        }

        .cart-item-actions button {
            width: 25px;
            height: 25px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 5px;
        }

        .cart-footer {
            padding: 1.5rem;
            border-top: 1px solid #eee;
        }

        .cart-total {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 15px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            z-index: 1001;
        }

        .modal.active {
            display: block;
        }

        .modal select, .modal button {
            width: 100%;
            padding: 0.75rem;
            margin-top: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        /* Footer */
        .footer {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }

        @media (max-width: 768px) {
            .cart-sidebar {
                width: 100%;
            }
            
            .hero h1 {
                font-size: 2rem;
            }
            
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">⚽ KickOff <span>Jerseys</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search jerseys...">
        </div>
        <div class="cart-icon" onclick="openCart()">
            🛒
            <span class="cart-count" id="cartCount">0</span>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Gear Up Like a Champion</h1>
        <p>Official football jerseys from top clubs worldwide. Up to 40% OFF!</p>
        <button class="shop-btn" onclick="scrollToProducts()">Shop Now →</button>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Jerseys</button>
            <button class="filter-btn" data-filter="Premier League">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</button>
            <button class="filter-btn" data-filter="La Liga">🇪🇸 La Liga</button>
            <button class="filter-btn" data-filter="International">🌍 International</button>
        </div>

        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2024 KickOff Jerseys. All rights reserved.</p>
        <p style="margin-top: 0.5rem;">⚽ Premium Football Jerseys | Worldwide Shipping</p>
    </div>

    <!-- Cart Sidebar -->
    <div class="overlay" id="overlay" onclick="closeCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button class="close-cart" onclick="closeCart()">×</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">Total: $<span id="cartTotal">0.00</span></div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Size Modal -->
    <div class="modal" id="sizeModal">
        <h3>Select Size</h3>
        <select id="sizeSelect">
            <option value="S">Small (S)</option>
            <option value="M">Medium (M)</option>
            <option value="L">Large (L)</option>
            <option value="XL">Extra Large (XL)</option>
            <option value="XXL">XX Large (XXL)</option>
        </select>
        <button onclick="addToCartConfirmed()">Add to Cart</button>
        <button onclick="closeModal()" style="background: #eee;">Cancel</button>
    </div>

    <script>
        // Jersey Data
        const jerseys = [
            { id: 1, name: "Manchester United Home 24/25", club: "Manchester United", league: "Premier League", price: 79.99, originalPrice: 119.99, rating: 4.7, image: "🔴", featured: true },
            { id: 2, name: "Liverpool Home 24/25", club: "Liverpool", league: "Premier League", price: 84.99, originalPrice: 124.99, rating: 4.8, image: "🔴", featured: true },
            { id: 3, name: "Arsenal Home 24/25", club: "Arsenal", league: "Premier League", price: 86.99, originalPrice: 129.99, rating: 4.7, image: "🔴", featured: false },
            { id: 4, name: "Barcelona Home 24/25", club: "Barcelona", league: "La Liga", price: 89.99, originalPrice: 129.99, rating: 4.9, image: "🔴🔵", featured: true },
            { id: 5, name: "Real Madrid Home 24/25", club: "Real Madrid", league: "La Liga", price: 94.99, originalPrice: 139.99, rating: 4.9, image: "⚪", featured: true },
            { id: 6, name: "Argentina National Jersey", club: "Argentina", league: "International", price: 79.99, originalPrice: 119.99, rating: 4.9, image: "🔵⚪", featured: true },
            { id: 7, name: "Brazil National Jersey", club: "Brazil", league: "International", price: 82.99, originalPrice: 124.99, rating: 4.8, image: "🟡", featured: false },
            { id: 8, name: "France National Jersey", club: "France", league: "International", price: 89.99, originalPrice: 129.99, rating: 4.7, image: "🔵", featured: false },
            { id: 9, name: "Bayern Munich Home", club: "Bayern Munich", league: "Bundesliga", price: 87.99, originalPrice: 129.99, rating: 4.7, image: "🔴", featured: false },
            { id: 10, name: "PSG Home 24/25", club: "PSG", league: "Ligue 1", price: 99.99, originalPrice: 149.99, rating: 4.6, image: "🔵", featured: true },
            { id: 11, name: "Chelsea Home 24/25", club: "Chelsea", league: "Premier League", price: 82.99, originalPrice: 119.99, rating: 4.5, image: "🔵", featured: false },
            { id: 12, name: "Juventus Home", club: "Juventus", league: "Serie A", price: 84.99, originalPrice: 124.99, rating: 4.7, image: "⚫⚪", featured: false }
        ];

        let cart = [];
        let currentFilter = "all";
        let searchTerm = "";
        let selectedJersey = null;

        // Load cart from localStorage
        function loadCart() {
            const saved = localStorage.getItem("cart");
            if (saved) cart = JSON.parse(saved);
            updateCartUI();
        }

        // Save cart
        function saveCart() {
            localStorage.setItem("cart", JSON.stringify(cart));
        }

        // Update cart UI
        function updateCartUI() {
            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById("cartCount").textContent = cartCount;
            
            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById("cartTotal").textContent = cartTotal.toFixed(2);
            
            renderCartItems();
        }

        // Render cart items
        function renderCartItems() {
            const container = document.getElementById("cartItems");
            if (cart.length === 0) {
                container.innerHTML = "<p style='text-align:center; padding:2rem;'>Your cart is empty</p>";
                return;
            }
            
            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div style="font-size:2rem;">${item.image}</div>
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.name}</div>
                        <div>Size: ${item.size}</div>
                        <div class="cart-item-price">$${item.price}</div>
                        <div class="cart-item-actions">
                            <button onclick="updateQuantity(${item.id}, '${item.size}', -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="updateQuantity(${item.id}, '${item.size}', 1)">+</button>
                            <button onclick="removeFromCart(${item.id}, '${item.size}')" style="background:#ef4444;">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        // Update quantity
        function updateQuantity(id, size, change) {
            const item = cart.find(i => i.id === id && i.size === size);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => !(i.id === id && i.size === size));
                }
                saveCart();
                updateCartUI();
            }
        }

        // Remove from cart
        function removeFromCart(id, size) {
            cart = cart.filter(i => !(i.id === id && i.size === size));
            saveCart();
            updateCartUI();
        }

        // Open size modal
        function openSizeModal(jersey) {
            selectedJersey = jersey;
            document.getElementById("sizeModal").classList.add("active");
        }

        // Close modal
        function closeModal() {
            document.getElementById("sizeModal").classList.remove("active");
            selectedJersey = null;
        }

        // Add to cart confirmed
        function addToCartConfirmed() {
            const size = document.getElementById("sizeSelect").value;
            const existing = cart.find(i => i.id === selectedJersey.id && i.size === size);
            
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...selectedJersey, size, quantity: 1 });
            }
            
            saveCart();
            updateCartUI();
            closeModal();
            openCart();
        }

        // Open cart
        function openCart() {
            document.getElementById("cartSidebar").classList.add("open");
            document.getElementById("overlay").classList.add("active");
        }

        // Close cart
        function closeCart() {
            document.getElementById("cartSidebar").classList.remove("open");
            document.getElementById("overlay").classList.remove("active");
        }

        // Checkout
        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            alert("Thank you for your purchase! 🎉\nTotal: $" + document.getElementById("cartTotal").textContent);
            cart = [];
            saveCart();
            updateCartUI();
            closeCart();
        }

        // Render products
        function renderProducts() {
            let filtered = jerseys;
            
            if (currentFilter !== "all") {
                filtered = filtered.filter(j => j.league === currentFilter);
            }
            
            if (searchTerm) {
                filtered = filtered.filter(j => 
                    j.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    j.club.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }
            
            const container = document.getElementById("productsGrid");
            container.innerHTML = filtered.map(jersey => `
                <div class="product-card">
                    <div class="product-image">${jersey.image}</div>
                    <div class="product-info">
                        <div class="product-title">${jersey.name}</div>
                        <div class="product-club">${jersey.club} • ${jersey.league}</div>
                        <div class="product-price">
                            $${jersey.price}
                            <span class="original-price">$${jersey.originalPrice}</span>
                        </div>
                        <div class="product-rating">${"★".repeat(Math.floor(jersey.rating))}${jersey.rating % 1 ? "½" : ""} (${jersey.rating})</div>
                        <button class="add-to-cart" onclick='openSizeModal(${JSON.stringify(jersey).replace(/'/g, "&#39;")})'>Add to Cart</button>
                    </div>
                </div>
            `).join("");
        }

        // Filter products
        function filterProducts(filter) {
            currentFilter = filter;
            document.querySelectorAll(".filter-btn").forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });
            renderProducts();
        }

        // Search products
        function searchProducts() {
            searchTerm = document.getElementById("searchInput").value;
            renderProducts();
        }

        // Scroll to products
        function scrollToProducts() {
            document.querySelector(".container").scrollIntoView({ behavior: "smooth" });
        }

        // Event listeners
        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.addEventListener("click", () => filterProducts(btn.dataset.filter));
        });
        
        document.getElementById("searchInput").addEventListener("input", searchProducts);
        
        // Initialize
        loadCart();
        renderProducts();
    </script>
</body>
</html>
